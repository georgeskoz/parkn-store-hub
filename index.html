<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This file is the static SPA shell Vercel serves for EVERY route
         (see vercel.json's catch-all rewrite to /index.html) -- it is also
         exactly what any crawler that doesn't execute JavaScript sees,
         including most AI-answer-engine bots (GPTBot, ClaudeBot,
         PerplexityBot) and Googlebot's first indexing pass, before
         SEO.tsx's react-helmet-async tags ever get a chance to override it
         client-side. Keep this in sync with src/i18n/locales/en.json's
         "seo.home" copy -- it was previously stale (wrong brand casing,
         Quebec-only framing, outdated tagline) for long enough that it was
         probably the FIRST thing search/AI crawlers ever saw for this
         site, regardless of what the live React app actually renders. -->
    <title>SpotsVault — Find Parking & Storage Spaces in Canada</title>
    <meta name="description" content="Discover and book parking spots and storage spaces near you. List your unused space and earn. Canada's peer-to-peer parking and storage marketplace." />
    <meta name="author" content="SpotsVault" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta property="og:title" content="SpotsVault — Find Parking & Storage Spaces in Canada" />
    <meta property="og:description" content="Discover and book parking spots and storage spaces near you. List your unused space and earn. Canada's peer-to-peer parking and storage marketplace." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spotsvault.com/" />
    <meta property="og:image" content="https://spotsvault.com/og-default.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpotsVault — Find Parking & Storage Spaces in Canada" />
    <meta name="twitter:description" content="Discover and book parking spots and storage spaces near you. List your unused space and earn. Canada's peer-to-peer parking and storage marketplace." />
    <meta name="twitter:image" content="https://spotsvault.com/og-default.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SpotsVault",
        "url": "https://spotsvault.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://spotsvault.com/find?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SpotsVault",
        "url": "https://spotsvault.com/",
        "description": "Peer-to-peer marketplace for parking and storage spaces across Canada. Renters book a spot near them; hosts list unused driveways, garages, or storage space and set their own price."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
